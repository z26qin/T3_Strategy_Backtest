version: "3.9"

services:
  # FastAPI backend — REST API on port 8000
  api:
    build: .
    container_name: tqqq-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8008
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}          # Optional: set in .env or shell
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dash frontend — Dashboard on port 8050
  dashboard:
    build: .
    container_name: tqqq-dashboard
    command: python app.py
    ports:
      - "8050:8050"
    environment:
      - DASH_HOST=0.0.0.0             # Bind to all interfaces inside container
    depends_on:
      - api
    restart: unless-stopped
